<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1100">
<meta name="robots" content="noindex,nofollow">
<title>Novogarden — poste de gestion</title>
<link rel="icon" href="icons/icon-192.png">
<style>
/* ---------------------------------------------------------------------------
   Poste de gestion Novogarden — interface bureau.

   Pensee pour un grand ecran : l'onglet Admin de l'application mobile reste en
   place et n'est pas modifie. Ici on assume la largeur, donc des tableaux
   plutot que des cartes empilees, et l'edition directe dans la ligne plutot
   que des fenetres successives.

   Aucun prix n'est ecrit en dur : la grille vient de data/pricing.json, comme
   dans le reste du projet.
--------------------------------------------------------------------------- */
:root{
  --vert:#7DB532; --vert-fonce:#5f8c25; --vert-pale:#f2f8ea;
  --encre:#1f2a17; --gris:#6b7280; --trait:#e3e6e0; --fond:#f6f7f4;
  --rouge:#c0392b; --ambre:#b7791f; --bleu:#2f6f9f;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--encre);background:var(--fond)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--bleu)}

/* ----- ossature ----- */
#appli{display:none;height:100%}
#appli.pret{display:grid;grid-template-columns:224px 1fr}
.rail{background:#233018;color:#e8efe0;display:flex;flex-direction:column;padding:18px 0}
.rail .marque{font-size:19px;font-weight:600;padding:0 20px 18px;letter-spacing:.2px}
.rail .marque span{color:var(--vert)}
.rail nav{flex:1;display:flex;flex-direction:column;gap:2px;padding:0 10px}
.rail nav button{display:flex;align-items:center;gap:10px;background:none;border:0;color:#c9d6bb;text-align:left;padding:9px 12px;border-radius:7px;cursor:pointer}
.rail nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.rail nav button.actif{background:var(--vert);color:#fff;font-weight:600}
.rail nav .pastille{margin-left:auto;background:rgba(255,255,255,.18);border-radius:9px;padding:1px 7px;font-size:11px}
.rail nav button.actif .pastille{background:rgba(0,0,0,.22)}
.rail .pied{padding:14px 20px 0;border-top:1px solid rgba(255,255,255,.12);margin-top:12px;font-size:12px;color:#9fb08c}
.rail .pied button{margin-top:8px;background:none;border:1px solid rgba(255,255,255,.25);color:#e8efe0;border-radius:6px;padding:5px 10px;cursor:pointer}
.rail .pied button:hover{background:rgba(255,255,255,.1)}

main{overflow:auto;padding:22px 26px 60px}
.entete{display:flex;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.entete h1{font-size:22px;margin:0;font-weight:600}
.entete .sous{color:var(--gris);font-size:13px;margin:0}
.entete .droite{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ----- briques ----- */
.carte{background:#fff;border:1px solid var(--trait);border-radius:10px;padding:16px 18px;margin-bottom:16px}
.carte > h2{font-size:14px;text-transform:uppercase;letter-spacing:.6px;color:var(--gris);margin:0 0 12px;font-weight:600}
.chiffres{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.chiffre{background:#fff;border:1px solid var(--trait);border-radius:10px;padding:14px 16px}
.chiffre .val{font-size:26px;font-weight:600;line-height:1.1}
.chiffre .lib{font-size:12px;color:var(--gris);margin-top:3px}
.chiffre.accent .val{color:var(--vert-fonce)}
.chiffre.alerte .val{color:var(--ambre)}

table{width:100%;border-collapse:collapse;background:#fff}
thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--gris);padding:9px 10px;border-bottom:1px solid var(--trait);white-space:nowrap;background:#fbfcfa;position:sticky;top:0;z-index:1}
tbody td{padding:8px 10px;border-bottom:1px solid #f0f2ee;vertical-align:middle}
tbody tr:hover{background:var(--vert-pale)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tableau{border:1px solid var(--trait);border-radius:10px;overflow:auto;max-height:calc(100vh - 260px)}

.etiq{display:inline-block;padding:2px 8px;border-radius:11px;font-size:11.5px;font-weight:600;white-space:nowrap}
.e-nouveau{background:#e8f0fb;color:#2f6f9f}
.e-contacte{background:#eef1ec;color:#5b6b52}
.e-devis_envoye{background:#fdf3e0;color:var(--ambre)}
.e-confirme{background:var(--vert-pale);color:var(--vert-fonce)}
.e-encaisse{background:#dff0d0;color:#3d6b17}
.e-commission_versee{background:#d5e8f7;color:#1f5c8a}
.e-perdu{background:#fbe9e7;color:var(--rouge)}
.e-ouverte{background:#e8f0fb;color:#2f6f9f}
.e-acceptee{background:#fdf3e0;color:var(--ambre)}
.e-en_cours{background:#fdf3e0;color:var(--ambre)}
.e-terminee{background:#dff0d0;color:#3d6b17}
.e-annulee{background:#fbe9e7;color:var(--rouge)}

select,input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],textarea{
  border:1px solid var(--trait);border-radius:6px;padding:6px 8px;background:#fff;max-width:100%}
select:focus,input:focus,textarea:focus{outline:2px solid var(--vert);outline-offset:-1px}
.bouton{background:var(--vert);color:#fff;border:0;border-radius:7px;padding:8px 14px;cursor:pointer;font-weight:600}
.bouton:hover{background:var(--vert-fonce)}
.bouton.creux{background:#fff;color:var(--encre);border:1px solid var(--trait);font-weight:500}
.bouton.creux:hover{background:#f2f4f0}
.bouton:disabled{opacity:.5;cursor:default}
.mini{padding:4px 9px;font-size:12.5px;border-radius:6px}

.filtres{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filtres input[type=text]{min-width:220px}
.vide{padding:34px;text-align:center;color:var(--gris)}
.note{font-size:12.5px;color:var(--gris)}
.erreur{background:#fbe9e7;border:1px solid #f0c6c0;color:var(--rouge);padding:9px 12px;border-radius:7px;margin-bottom:12px;font-size:13px}
.ok{background:var(--vert-pale);border:1px solid #cde3ad;color:var(--vert-fonce);padding:9px 12px;border-radius:7px;margin-bottom:12px;font-size:13px}

/* ----- connexion ----- */
#porte{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
#porte .boite{background:#fff;border:1px solid var(--trait);border-radius:12px;padding:28px;width:360px;box-shadow:0 12px 34px rgba(0,0,0,.07)}
#porte h1{font-size:19px;margin:0 0 4px}
#porte p{margin:0 0 18px;color:var(--gris);font-size:13px}
#porte label{display:block;font-size:12px;color:var(--gris);margin:12px 0 4px}
#porte input{width:100%}
#porte .bouton{width:100%;margin-top:18px;padding:10px}

/* ----- grille de couverture ----- */
.couv{border-collapse:collapse}
.couv th.dep{text-align:left}
.couv td.case{text-align:center}
.couv input[type=checkbox]{width:17px;height:17px;accent-color:var(--vert);cursor:pointer}

.carte-fr{width:100%;max-width:620px;display:block;margin:0 auto}
/* Le trait est exprime dans les unites du fond de carte, large de 1000 :
   une valeur en pixels y serait enorme. */
.carte-fr path{stroke:#fff;stroke-width:2;cursor:pointer}
.carte-fr path:hover{stroke:#233018;stroke-width:5}
.legende{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.legende span{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--gris)}
.legende i{width:13px;height:13px;border-radius:3px;display:inline-block}
/* ----- pinceau de couverture ----- */
.palette{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.palette .sep{width:1px;height:24px;background:var(--trait);margin:0 6px}
.teinte{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--trait);background:#fff;border-radius:20px;padding:5px 12px 5px 8px;cursor:pointer;font-size:13px}
.teinte i{width:14px;height:14px;border-radius:4px;display:inline-block}
.teinte.actif{border-color:var(--encre);box-shadow:0 0 0 2px rgba(35,48,24,.12);font-weight:600}
.outil{border:1px solid var(--trait);background:#fff;border-radius:7px;padding:6px 12px;cursor:pointer;font-size:13px}
.outil.actif{background:var(--encre);color:#fff;border-color:var(--encre);font-weight:600}
.compteur{font-size:12.5px;color:var(--ambre);font-weight:600}
.carte-fr{touch-action:none;user-select:none}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.photos img{width:104px;height:78px;object-fit:cover;border-radius:6px;border:1px solid var(--trait)}
.bandeau-essai{background:#fdf3e0;border-bottom:1px solid #efd9a8;color:var(--ambre);padding:6px 26px;font-size:12.5px}
</style>
</head>
<body>

<div id="porte">
  <form class="boite" id="form-porte">
    <h1>Poste de gestion</h1>
    <p>Reserve a l'administration Novogarden.</p>
    <div id="porte-msg"></div>
    <label for="p-email">Adresse email</label>
    <input id="p-email" type="email" autocomplete="username" required>
    <label for="p-mdp">Mot de passe</label>
    <input id="p-mdp" type="password" autocomplete="current-password" required>
    <button class="bouton" type="submit" id="p-envoi">Se connecter</button>
    <p class="note" style="margin-top:14px">Meme compte que l'application.</p>
  </form>
</div>

<div id="appli">
  <aside class="rail">
    <div class="marque">Novo<span>garden</span></div>
    <nav id="rail-nav"></nav>
    <div class="pied">
      <div id="rail-qui"></div>
      <button type="button" id="deconnexion">Se deconnecter</button>
    </div>
  </aside>
  <main id="scene"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/ng-config.js"></script>
<script>
(function () {
  'use strict';

  /* =====================================================================
     Socle
     ===================================================================== */

  var CFG = window.NG_CONFIG || {};
  var sb = null;
  var profil = null;
  var pricing = null;
  var ecran = 'bord';

  /* Caches memoire : les ecrans se croisent beaucoup (un lead renvoie a son
     apporteur, une mission a son prestataire). On charge les profils une fois
     et on s'y refere partout plutot que de multiplier les jointures. */
  var cache = { leads: null, missions: null, profils: null, couverture: null, cr: null,
                comptes: null, comptesErreur: null };

  var STATUTS_LEAD = ['nouveau', 'contacte', 'devis_envoye', 'confirme', 'encaisse', 'commission_versee', 'perdu'];
  var STATUTS_MISSION = ['ouverte', 'acceptee', 'en_cours', 'terminee', 'annulee'];
  var SERVICES = {
    'tonte': 'Tonte robotisee',
    'topographie': 'Topographie',
    'modelisation': 'Modelisation 3D',
    'impression': 'Impression 3D',
    'drone': 'Drone',
    'etude-flux': 'Etude de flux'
  };
  /* Memes teintes que les tuiles de l'application : la carte doit se lire
     sans effort par quelqu'un qui connait deja l'accueil. */
  var TEINTES = {
    'tonte': '#7DB532',
    'topographie': '#4A7C2F',
    'modelisation': '#26648E',
    'impression': '#C25E1B',
    'drone': '#37474F',
    'etude-flux': '#6A4C93'
  };
  var geoDeps = null;

  var LIB_STATUT = {
    nouveau: 'Nouveau', contacte: 'Contacte', devis_envoye: 'Devis envoye',
    confirme: 'Confirme', encaisse: 'Encaisse', commission_versee: 'Commission versee',
    perdu: 'Perdu', ouverte: 'Ouverte', acceptee: 'Acceptee', en_cours: 'En cours',
    terminee: 'Terminee', annulee: 'Annulee'
  };

  function $(s, r) { return (r || document).querySelector(s); }
  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function eur(n) {
    if (n == null || n === '') { return '—'; }
    return Number(n).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
  }
  function jour(d) {
    if (!d) { return '—'; }
    return new Date(d).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: '2-digit' });
  }
  function etiq(s) {
    return '<span class="etiq e-' + esc(s) + '">' + esc(LIB_STATUT[s] || s) + '<' + '/span>';
  }
  function nomDe(p) {
    if (!p) { return '—'; }
    return ((p.prenom || '') + ' ' + (p.nom || '')).trim() || p.email || '—';
  }

  /* =====================================================================
     Porte d'entree
     ===================================================================== */

  function messagePorte(txt, type) {
    $('#porte-msg').innerHTML = txt ? '<div class="' + (type || 'erreur') + '">' + esc(txt) + '<' + '/div>' : '';
  }

  $('#form-porte').addEventListener('submit', async function (e) {
    e.preventDefault();
    var b = $('#p-envoi');
    b.disabled = true; b.textContent = 'Connexion...';
    messagePorte('');
    var r = await sb.auth.signInWithPassword({
      email: $('#p-email').value.trim(),
      password: $('#p-mdp').value
    });
    b.disabled = false; b.textContent = 'Se connecter';
    if (r.error) {
      messagePorte('Connexion refusee. Verifiez l\'adresse et le mot de passe.');
      return;
    }
    await apresConnexion();
  });

  $('#deconnexion').addEventListener('click', async function () {
    await sb.auth.signOut();
    location.reload();
  });

  async function apresConnexion() {
    var s = await sb.auth.getSession();
    if (!s.data.session) { montrerPorte(); return; }

    var r = await sb.from('profiles').select('*').eq('id', s.data.session.user.id).maybeSingle();
    profil = r.data || null;

    /* Le refus repose sur les politiques RLS de Supabase, pas sur ce test :
       masquer l'interface n'empeche personne d'appeler l'API. Ce controle
       n'est la que pour eviter d'afficher des ecrans vides a quelqu'un qui
       n'y a pas droit. */
    if (!profil || !profil.is_admin) {
      await sb.auth.signOut();
      montrerPorte();
      messagePorte('Ce compte n\'a pas les droits d\'administration.');
      return;
    }

    $('#porte').style.display = 'none';
    $('#appli').classList.add('pret');
    $('#rail-qui').textContent = nomDe(profil);
    construireRail();
    await charger(true);
    aller('bord');
  }

  function montrerPorte() {
    $('#appli').classList.remove('pret');
    $('#porte').style.display = 'flex';
  }

  /* =====================================================================
     Navigation
     ===================================================================== */

  var ECRANS = [
    { id: 'bord', lib: 'Tableau de bord' },
    { id: 'leads', lib: 'Leads' },
    { id: 'missions', lib: 'Missions' },
    { id: 'reseau', lib: 'Reseau' },
    { id: 'couverture', lib: 'Couverture' },
    { id: 'cr', lib: 'Comptes rendus' },
    { id: 'comptes', lib: 'Comptes' }
  ];

  function construireRail() {
    $('#rail-nav').innerHTML = ECRANS.map(function (e) {
      return '<button type="button" data-ecran="' + e.id + '">' + esc(e.lib) +
        '<span class="pastille" data-cpt="' + e.id + '"><' + '/span><' + '/button>';
    }).join('');
    $('#rail-nav').addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-ecran]');
      if (b) { aller(b.getAttribute('data-ecran')); }
    });
  }

  function majPastilles() {
    var n = {
      leads: (cache.leads || []).filter(function (l) { return l.statut === 'nouveau'; }).length,
      missions: (cache.missions || []).filter(function (m) { return m.statut === 'ouverte'; }).length,
      reseau: (cache.profils || []).filter(function (p) { return p.is_apporteur && !p.code_apporteur; }).length,
      cr: (cache.cr || []).length
    };
    ECRANS.forEach(function (e) {
      var p = $('[data-cpt="' + e.id + '"]');
      if (!p) { return; }
      p.textContent = n[e.id] ? n[e.id] : '';
      p.style.display = n[e.id] ? '' : 'none';
    });
  }

  function aller(id) {
    ecran = id;
    [].forEach.call(document.querySelectorAll('[data-ecran]'), function (b) {
      b.classList.toggle('actif', b.getAttribute('data-ecran') === id);
    });
    ({
      bord: vueBord, leads: vueLeads, missions: vueMissions,
      reseau: vueReseau, couverture: vueCouverture, cr: vueCR,
      comptes: vueComptes
    })[id]();
  }

  /* =====================================================================
     Chargement des donnees
     ===================================================================== */

  async function charger(complet) {
    var t = [
      sb.from('leads').select('*').order('created_at', { ascending: false }),
      sb.from('missions').select('*').order('created_at', { ascending: false }),
      sb.from('profiles').select('*').order('created_at', { ascending: false }),
      sb.from('couverture').select('*'),
      sb.from('comptes_rendus').select('*, mission:missions(titre,type_prestation,commune), photos:cr_photos(*)').order('created_at', { ascending: false })
    ];
    var r = await Promise.all(t);
    cache.leads = r[0].data || [];
    cache.missions = r[1].data || [];
    cache.profils = r[2].data || [];
    cache.couverture = r[3].data || [];
    cache.cr = r[4].data || [];

    /* Les dates de connexion vivent dans auth.users, que le client ne peut
       pas lire. La fonction comptes_admin les expose, et refuse elle-meme
       tout appelant qui n'est pas administrateur. */
    var c = await sb.rpc('comptes_admin');
    cache.comptes = c.error ? [] : (c.data || []);
    cache.comptesErreur = c.error ? c.error.message : null;

    if (complet && !pricing) {
      try { pricing = await (await fetch('data/pricing.json', { cache: 'no-store' })).json(); }
      catch (e) { pricing = null; }
    }
    majPastilles();
  }

  function profilPar(id) {
    if (!id) { return null; }
    return (cache.profils || []).filter(function (p) { return p.id === id; })[0] || null;
  }

  function enteteHTML(titre, sous, droite) {
    return '<div class="entete"><div><h1>' + esc(titre) + '<' + '/h1>' +
      (sous ? '<p class="sous">' + esc(sous) + '<' + '/p>' : '') + '<' + '/div>' +
      '<div class="droite">' + (droite || '') +
      '<button class="bouton creux mini" id="rafraichir">Rafraichir<' + '/button><' + '/div><' + '/div>';
  }

  function brancherRafraichir() {
    var b = $('#rafraichir');
    if (!b) { return; }
    b.addEventListener('click', async function () {
      b.disabled = true; b.textContent = '...';
      await charger(false);
      aller(ecran);
    });
  }

  /* =====================================================================
     Tableau de bord
     ===================================================================== */

  function vueBord() {
    var L = cache.leads || [];
    var M = cache.missions || [];
    var P = cache.profils || [];

    var encaisse = L.filter(function (l) { return l.statut === 'encaisse' || l.statut === 'commission_versee'; });
    var ca = encaisse.reduce(function (s, l) { return s + Number(l.montant_ttc || 0); }, 0);
    var dues = L.filter(function (l) { return l.statut === 'encaisse' && Number(l.commission_montant || 0) > 0; })
      .reduce(function (s, l) { return s + Number(l.commission_montant || 0); }, 0);
    var versees = L.filter(function (l) { return l.statut === 'commission_versee'; })
      .reduce(function (s, l) { return s + Number(l.commission_montant || 0); }, 0);

    var parStatut = {};
    L.forEach(function (l) { parStatut[l.statut] = (parStatut[l.statut] || 0) + 1; });
    var parService = {};
    L.forEach(function (l) {
      var s = l.service || 'non precise';
      parService[s] = (parService[s] || 0) + 1;
    });

    var aGenerer = P.filter(function (p) { return p.is_apporteur && !p.code_apporteur; }).length;

    $('#scene').innerHTML =
      enteteHTML('Tableau de bord', 'Etat au ' + new Date().toLocaleDateString('fr-FR')) +
      '<div class="chiffres" style="margin-bottom:16px">' +
        chiffre(L.length, 'leads au total') +
        chiffre(parStatut.nouveau || 0, 'a traiter', (parStatut.nouveau ? 'alerte' : '')) +
        chiffre(eur(ca), 'encaisse', 'accent') +
        chiffre(eur(dues), 'commissions a verser', (dues ? 'alerte' : '')) +
        chiffre(eur(versees), 'commissions versees') +
        chiffre(M.filter(function (m) { return m.statut === 'ouverte'; }).length, 'missions non pourvues') +
      '<' + '/div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">' +
        '<div class="carte"><h2>Leads par statut<' + '/h2>' + barres(parStatut, L.length, STATUTS_LEAD) + '<' + '/div>' +
        '<div class="carte"><h2>Leads par prestation<' + '/h2>' + barres(parService, L.length, Object.keys(SERVICES)) + '<' + '/div>' +
      '<' + '/div>' +
      '<div class="carte"><h2>Reseau<' + '/h2>' +
        '<div class="chiffres">' +
          chiffre(P.filter(function (p) { return p.is_apporteur; }).length, 'apporteurs inscrits') +
          chiffre(aGenerer, 'codes a generer', (aGenerer ? 'alerte' : '')) +
          chiffre(P.filter(function (p) { return p.is_prestataire && p.prestataire_valide; }).length, 'prestataires valides') +
          chiffre(P.length, 'comptes au total') +
        '<' + '/div><' + '/div>';
    brancherRafraichir();
  }

  function chiffre(v, lib, cls) {

  /* La creation reste bornee a la grille tarifaire : on ne saisit pas un
     libelle ni une surface libres, on choisit une prestation puis une tranche
     existante. Un intitule invente ici ne correspondrait a aucun prix. */
  function formulaireMission() {
    if (!pricing) {

    $('#zone-form').innerHTML =

    $('#m-annuler').addEventListener('click', function () { $('#zone-form').innerHTML = ''; });

      $('#m-creer').disabled = false;
    });
    $('#m-creer').addEventListener('click', async function () {
      var b = this;
      var srv = $('#m-service').value;
      var t = tranchesDe(srv)[Number($('#m-tranche').value)];
      if (!srv || !t) { return; }
      b.disabled = true; b.textContent = 'Creation...';
      var r = await sb.from('missions').insert({
        titre: SERVICES[srv] + ' — ' + t.label,
        type_prestation: srv,

      await charger(false);
      aller('missions');
    });
  }

  /* Lecture souple de pricing.json : le fichier a evolue plusieurs fois, on
     accepte les formes rencontrees plutot que d'imposer une seule structure. */
  function tranchesDe(id) {
    if (!pricing || !id) { return []; }
    var svc = null;
    if (Array.isArray(pricing.services)) {
      svc = pricing.services.filter(function (s) { return s.id === id; })[0];
    } else if (pricing.services) {
      svc = pricing.services[id];
    }
    if (!svc) { return []; }
    var src = svc.tranches || svc.paliers || svc.grille || svc.prestations || [];
    if (!Array.isArray(src)) { src = Object.keys(src).map(function (k) { return src[k]; }); }
    return src.map(function (t, i) {
      return {
        label: t.label || t.libelle || t.nom || t.titre || ('Tranche ' + (i + 1)),
        prix: t.prix_ttc != null ? t.prix_ttc : (t.prix != null ? t.prix : (t.ttc != null ? t.ttc : null)),
        surface: t.surface_max || t.surface || null
      };
    });
  }

  function vueReseau() {
    var P = (cache.profils || []).filter(function (p) { return p.is_apporteur || p.is_prestataire; });
    var L = cache.leads || [];

    function bilan(id) {
      var s = L.filter(function (l) { return l.apporteur_id === id; });
      return {
        n: s.length,
        ca: s.filter(function (l) { return l.statut === 'encaisse' || l.statut === 'commission_versee'; })
             .reduce(function (a, l) { return a + Number(l.montant_ttc || 0); }, 0),
        du: s.filter(function (l) { return l.statut === 'encaisse'; })
             .reduce(function (a, l) { return a + Number(l.commission_montant || 0); }, 0),
        verse: s.filter(function (l) { return l.statut === 'commission_versee'; })
             .reduce(function (a, l) { return a + Number(l.commission_montant || 0); }, 0)
      };

    $('#scene').innerHTML =

      '<' + '/tr><' + '/thead><tbody>' +
      (P.length ? P.map(function (p) {
        var b = bilan(p.id);
        return '<tr data-profil="' + esc(p.id) + '">' +
          '<td>' + jour(p.created_at) + '<' + '/td>' +
          '<td><strong>' + esc(nomDe(p)) + '<' + '/strong><' + '/td>' +
          '<td class="note">' + esc(p.email || '') + (p.telephone ? '<br>' + esc(p.telephone) : '') + '<' + '/td>' +
          '<td>' + (p.code_apporteur
            ? '<code>' + esc(p.code_apporteur) + '<' + '/code>'
            : (p.is_apporteur ? '<button class="bouton mini gen">Generer<' + '/button>' : '—')) + '<' + '/td>' +
          '<td class="num">' + b.n + '<' + '/td>' +
          '<td class="num">' + eur(b.ca) + '<' + '/td>' +
          '<td class="num"' + (b.du ? ' style="color:var(--ambre);font-weight:600"' : '') + '>' + eur(b.du) + '<' + '/td>' +
          '<td class="num">' + eur(b.verse) + '<' + '/td>' +
          '<td><input type="checkbox" class="r-app"' + (p.is_apporteur ? ' checked' : '') + '><' + '/td>' +
          '<td><input type="checkbox" class="r-pre"' + (p.is_prestataire ? ' checked' : '') + '><' + '/td>' +
          '<td><input type="checkbox" class="r-val"' + (p.prestataire_valide ? ' checked' : '') +
            (p.is_prestataire ? '' : ' disabled') + '><' + '/td>' +
        '<' + '/tr>';
      }).join('') : '<tr><td colspan="11" class="vide">Personne dans le reseau.<' + '/td><' + '/tr>') +
      '<' + '/tbody><' + '/table><' + '/div>' +
      '<p class="note" style="margin-top:10px">« A verser » compte les leads encaisses dont la commission n\'a pas encore ete payee. Passez le lead en « Commission versee » une fois le virement fait.<' + '/p>';

    brancherRafraichir();

    $('#scene').addEventListener('click', async function (ev) {
      if (!ev.target.classList.contains('gen')) { return; }
      var tr = ev.target.closest('[data-profil]');
      var p = profilPar(tr.getAttribute('data-profil'));
      ev.target.disabled = true;
      var code = codeLibre(p);

      if (r.error) { ev.target.disabled = false; alert('Refus : ' + r.error.message); return; }
      await charger(false);

                 ev.target.classList.contains('r-val');
      if (!tr || !role) { return; }
      ev.target.disabled = true;
      var r = await sb.rpc('definir_roles', {
        p_profil: tr.getAttribute('data-profil'),
        p_apporteur: $('.r-app', tr).checked,
        p_prestataire: $('.r-pre', tr).checked,
        p_valide: $('.r-val', tr).checked
      });
      ev.target.disabled = false;
      if (r.error) { alert('Refus : ' + r.error.message); return; }
      await charger(false);
      aller('reseau');
    });
  }

  /* Le code doit rester lisible a l'oral : on le dicte au telephone. Trois
     lettres du nom et trois chiffres. */
  function codeLibre(p) {
    var base = (p.nom || p.prenom || 'NGD').toUpperCase().replace(/[^A-Z]/g, '');
    base = (base + 'NGD').slice(0, 3);
    var pris = (cache.profils || []).map(function (x) { return x.code_apporteur; }).filter(Boolean);
    for (var i = 0; i < 400; i++) {
      var c = base + String(Math.floor(100 + Math.random() * 900));
      if (pris.indexOf(c) < 0) { return c; }
    }
    return base + Date.now().toString().slice(-4);
  }

      var tr = ev.target.closest('[data-dep]');
      if (!tr || ev.target.type !== 'checkbox') { return; }
      ev.target.disabled = true;
      var r = await sb.from('couverture').upsert({
        service: ev.target.getAttribute('data-srv'),
        departement: tr.getAttribute('data-dep'),
        actif: ev.target.checked,
        maj: new Date().toISOString()
      }, { onConflict: 'service,departement' });
      ev.target.disabled = false;
      if (r.error) { ev.target.checked = !ev.target.checked; alert('Refus : ' + r.error.message); return; }
      await charger(false);
    });
  }

  /* =====================================================================
     Comptes rendus
     ===================================================================== */

  function vueCR() {
    var R = cache.cr || [];
    $('#scene').innerHTML =
      enteteHTML('Comptes rendus', R.length + ' rapports d\'intervention') +
      (R.length ? R.map(function (c) {
        var p = profilPar(c.prestataire_id);
        var ph = (c.photos || []);
        return '<div class="carte">' +
          '<div style="display:flex;gap:12px;align-items:baseline;flex-wrap:wrap">' +
            '<strong>' + esc(c.mission && c.mission.titre ? c.mission.titre : 'Mission supprimee') + '<' + '/strong>' +
            '<span class="note">' + esc(c.mission && c.mission.commune ? c.mission.commune : '') + '<' + '/span>' +
            '<span class="note">' + esc(nomDe(p)) + '<' + '/span>' +
            '<span class="note" style="margin-left:auto">' + jour(c.created_at) +
              (c.duree_minutes ? ' · ' + c.duree_minutes + ' min' : '') + '<' + '/span>' +
          '<' + '/div>' +
          (c.commentaire ? '<p style="margin:10px 0 0">' + esc(c.commentaire) + '<' + '/p>' : '') +
          (ph.length ? '<div class="photos" data-photos="' + esc(c.id) + '"><' + '/div>' : '') +
        '<' + '/div>';
      }).join('') : '<div class="carte vide">Aucun compte rendu.<' + '/div>');
    brancherRafraichir();
    R.forEach(afficherPhotos);
  }

  /* Les photos vivent dans un seau prive : une URL directe ne donnerait rien.
     On demande des liens signes, valables une heure, au moment de l'affichage. */
  async function afficherPhotos(c) {
    var zone = $('[data-photos="' + c.id + '"]');
    if (!zone || !c.photos || !c.photos.length) { return; }
    var chemins = c.photos.map(function (p) { return p.storage_path; }).filter(Boolean);
    if (!chemins.length) { return; }
    var r = await sb.storage.from('comptes-rendus').createSignedUrls(chemins, 3600);
    if (r.error || !r.data) { zone.innerHTML = '<span class="note">Photos illisibles.<' + '/span>'; return; }
    zone.innerHTML = r.data.filter(function (u) { return u.signedUrl; }).map(function (u, i) {
      return '<img src="' + esc(u.signedUrl) + '" alt="' + esc((c.photos[i] || {}).type || 'photo') + '" loading="lazy">';
    }).join('');
  }

  /* =====================================================================
     Carte de couverture, et pinceau
     ===================================================================== */

  /* Le fond de carte est un fichier du depot, deja projete et allege : les
     contours sont des chaines SVG pretes a l'emploi. Le telecharger tout fait
     evite d'embarquer une bibliotheque cartographique et de dependre d'un CDN
     externe a chaque ouverture de l'ecran. */
  var FOND = 'data/departements.json';
  var ORDRE = ['tonte', 'topographie', 'modelisation', 'impression', 'drone', 'etude-flux'];

  /* On peint dans un brouillon, jamais directement en base. Un glissement de
     souris survole vite trente departements : ecrire a chaque passage
     enverrait des dizaines de requetes et laisserait la base a moitie
     modifiee si le reseau lache en cours de route. */
  var pinceau = { service: 'tonte', mode: 'colorier' };
  var brouillon = null;
  var reference = null;
  var enPeinture = false;

  async function dessinerCarte() {
    var zone = $('#carte-zone');
    if (!zone) { return; }
    if (!geoDeps) {
      try { geoDeps = await (await fetch(FOND, { cache: 'force-cache' })).json(); }
      catch (e) {
        zone.innerHTML = '<p class="note" style="text-align:center">Fond de carte indisponible.<' + '/p>';
        return;
      }
    }
    if (!$('#carte-zone')) { return; }

    reference = etatDepuisBase();
    brouillon = etatDepuisBase();
    zone.innerHTML = palette() + svgCarte(geoDeps) + legende();
    brancherPalette();
    brancherPinceau();
  }

  function etatDepuisBase() {
    var e = {};
    Object.keys(geoDeps.departements).forEach(function (code) {
      var o = {};
      servicesDe(code).forEach(function (s) { o[s] = true; });
      e[code] = o;
    });
    return e;
  }

  /* Services actifs pour un departement, en tenant compte des lignes 'FR' qui
     valent pour tout le pays. Une ligne locale l'emporte toujours sur la ligne
     nationale : c'est ce qui permet de fermer une prestation dans un seul
     departement sans toucher au reste. */
  function servicesDe(dep) {
    var C = cache.couverture || [];
    var out = [];
    ORDRE.forEach(function (s) {
      var national = C.filter(function (x) { return x.service === s && x.departement === 'FR'; })[0];
      var local = C.filter(function (x) { return x.service === s && x.departement === dep; })[0];
      var ouvert = local ? local.actif : (national ? national.actif : false);
      if (ouvert) { out.push(s); }
    });
    return out;
  }

  function actifsDe(code) {
    var o = (brouillon && brouillon[code]) || {};
    return ORDRE.filter(function (s) { return o[s]; });
  }

  /* ---------- barre d'outils ---------- */

  function palette() {
    return '<div class="palette">' +
      ORDRE.map(function (s) {
        return '<button type="button" class="teinte' + (pinceau.service === s ? ' actif' : '') +
          '" data-teinte="' + s + '"><i style="background:' + TEINTES[s] + '"><' + '/i>' +
          esc(SERVICES[s]) + '<' + '/button>';
      }).join('') +
      '<span class="sep"><' + '/span>' +
      '<button type="button" class="outil actif" data-mode="colorier">Colorier<' + '/button>' +
      '<button type="button" class="outil" data-mode="effacer">Effacer<' + '/button>' +
      '<button type="button" class="outil" data-mode="vider">Tout retirer<' + '/button>' +
      '<span class="sep"><' + '/span>' +
      '<button type="button" class="bouton mini" id="p-enr" disabled>Enregistrer<' + '/button>' +
      '<button type="button" class="bouton creux mini" id="p-ann" disabled>Annuler<' + '/button>' +
      '<span class="compteur" id="p-cpt"><' + '/span>' +
      '<' + '/div>';
  }

  function brancherPalette() {
    var barre = $('.palette');
    barre.addEventListener('click', function (ev) {
      var t = ev.target.closest('[data-teinte]');
      if (t) {
        pinceau.service = t.getAttribute('data-teinte');
        [].forEach.call(barre.querySelectorAll('[data-teinte]'), function (b) {
          b.classList.toggle('actif', b === t);
        });
        /* Choisir une couleur veut dire qu'on va peindre : rester en mode
           gomme apres un clic sur la palette serait deroutant. */
        if (pinceau.mode === 'vider') { choisirMode('colorier'); }
        return;
      }
      var m = ev.target.closest('[data-mode]');
      if (m) { choisirMode(m.getAttribute('data-mode')); }
    });
    $('#p-enr').addEventListener('click', enregistrerPeinture);
    $('#p-ann').addEventListener('click', function () {
      brouillon = etatDepuisBase();
      Object.keys(brouillon).forEach(majTeinte);
      majCompteur();
    });
  }

  function choisirMode(m) {
    pinceau.mode = m;
    [].forEach.call(document.querySelectorAll('[data-mode]'), function (b) {
      b.classList.toggle('actif', b.getAttribute('data-mode') === m);
    });
  }

  /* ---------- peinture ---------- */

  function brancherPinceau() {
    var svg = $('.carte-fr');
    if (!svg) { return; }
    svg.addEventListener('pointerdown', function (ev) {
      var p = ev.target.closest('[data-dep]');
      if (!p) { return; }
      enPeinture = true;
      /* La capture garde le trace vivant meme si le curseur sort d'un
         departement. Certains navigateurs la refusent selon le type de
         pointeur : ce n'est pas bloquant, on continue sans. */
      try { svg.setPointerCapture(ev.pointerId); } catch (e) { /* sans capture */ }
      appliquer(p.getAttribute('data-dep'));
      ev.preventDefault();
    });
    /* Avec la capture du pointeur, les evenements ne visent plus le
       departement survole : on retrouve donc l'element sous le curseur par ses
       coordonnees. */
    svg.addEventListener('pointermove', function (ev) {
      if (!enPeinture) { return; }
      var el = document.elementFromPoint(ev.clientX, ev.clientY);
      var p = el && el.closest ? el.closest('[data-dep]') : null;
      if (p) { appliquer(p.getAttribute('data-dep')); }
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (t) {
      svg.addEventListener(t, function () { enPeinture = false; });
    });
  }

  function appliquer(code) {
    var o = brouillon[code] || (brouillon[code] = {});
    if (pinceau.mode === 'vider') { brouillon[code] = {}; }
    else if (pinceau.mode === 'effacer') { delete o[pinceau.service]; }
    else { o[pinceau.service] = true; }
    majTeinte(code);
    majCompteur();
  }

  function majCompteur() {
    var n = differences().length;
    $('#p-cpt').textContent = n ? (n + ' changement' + (n > 1 ? 's' : '') + ' en attente') : '';
    $('#p-enr').disabled = !n;
    $('#p-ann').disabled = !n;
  }

  function differences() {
    var out = [];
    Object.keys(brouillon).forEach(function (code) {
      ORDRE.forEach(function (s) {
        var avant = !!(reference[code] && reference[code][s]);
        var apres = !!brouillon[code][s];
        if (avant !== apres) {
          out.push({ service: s, departement: code, actif: apres });
        }
      });
    });
    return out;
  }

  async function enregistrerPeinture() {
    var diff = differences();
    if (!diff.length) { return; }
    var b = $('#p-enr');
    b.disabled = true; b.textContent = 'Enregistrement...';
    var maintenant = new Date().toISOString();
    var r = await sb.from('couverture').upsert(
      diff.map(function (x) {
        return { service: x.service, departement: x.departement, actif: x.actif, maj: maintenant };
      }),
      { onConflict: 'service,departement' }
    );
    b.textContent = 'Enregistrer';
    if (r.error) { b.disabled = false; alert('Refus : ' + r.error.message); return; }
    await charger(false);
    aller('couverture');
  }

  /* ---------- rendu ---------- */

  function svgCarte(fond) {
    var degrades = [];
    var formes = Object.keys(fond.departements).map(function (code) {
      var dp = fond.departements[code];
      degrades.push('<linearGradient id="bande-' + code + '" x1="0" y1="0" x2="0" y2="1"><' + '/linearGradient>');
      return '<path id="dep-' + code + '" d="' + dp.d + '" data-dep="' + esc(code) + '">' +
        '<title id="t-' + code + '">' + esc(dp.n) + ' (' + esc(code) + ')<' + '/title><' + '/path>';
    }).join('');

    var svg = '<svg class="carte-fr" viewBox="0 0 ' + fond.largeur + ' ' + fond.hauteur +
      '" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Couverture par departement">' +
      '<defs id="bandes">' + degrades.join('') + '<' + '/defs>' + formes + '<' + '/svg>';

    /* Les teintes sont posees apres coup, une fois les elements dans le
       document : la meme fonction sert ensuite a chaque coup de pinceau. */
    setTimeout(function () { Object.keys(fond.departements).forEach(majTeinte); }, 0);
    return svg;
  }

  function majTeinte(code) {
    var p = document.getElementById('dep-' + code);
    if (!p) { return; }
    var actifs = actifsDe(code);
    var g = document.getElementById('bande-' + code);

    if (!actifs.length) {
      p.setAttribute('fill', '#e9ece7');
    } else if (actifs.length === 1) {
      p.setAttribute('fill', TEINTES[actifs[0]]);
    } else if (g) {
      /* Plusieurs prestations : le departement est partage en bandes egales.
         Chaque arret est double pour obtenir une frange nette ; un degrade
         continu rendrait les couleurs impossibles a distinguer. */
      var pas = 100 / actifs.length;
      g.innerHTML = actifs.map(function (s, k) {
        return '<stop offset="' + (k * pas).toFixed(2) + '%" stop-color="' + TEINTES[s] + '"/>' +
               '<stop offset="' + ((k + 1) * pas).toFixed(2) + '%" stop-color="' + TEINTES[s] + '"/>';
      }).join('');
      p.setAttribute('fill', 'url(#bande-' + code + ')');
    }

    var t = document.getElementById('t-' + code);
    if (t && geoDeps) {
      var nom = geoDeps.departements[code] ? geoDeps.departements[code].n : code;
      t.textContent = nom + ' (' + code + ') — ' +
        (actifs.map(function (s) { return SERVICES[s]; }).join(', ') || 'aucune prestation');
    }
  }

  function legende() {
    return '<div class="legende">' +
      ORDRE.map(function (s) {
        return '<span><i style="background:' + TEINTES[s] + '"><' + '/i>' + esc(SERVICES[s]) + '<' + '/span>';
      }).join('') +
      '<span><i style="background:#e9ece7"><' + '/i>non couvert<' + '/span>' +
      '<' + '/div>' +
      '<p class="note" style="text-align:center;margin-top:8px">Choisissez une prestation, puis peignez en maintenant le clic sur la carte. Rien n\'est enregistre avant d\'avoir appuye sur Enregistrer. France metropolitaine uniquement.<' + '/p>';
  }

  /* =====================================================================
     Comptes
     ===================================================================== */

  function heure(d) {
    if (!d) { return null; }
    return new Date(d).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' });
  }

  function vueComptes() {
    var C = cache.comptes || [];
    var P = cache.profils || [];

    /* Un compte existe dans auth.users ; sa fiche vit dans profiles. On lit les
       deux et on les rapproche par identifiant, pour montrer sur une seule
       ligne qui s'est inscrit, quand, et s'il est deja revenu. */
    var lignes = C.map(function (c) {
      var p = P.filter(function (x) { return x.id === c.id; })[0] || {};
      return {
        id: c.id,
        email: c.email || p.email || '',
        cree: c.cree_le,
        confirme: c.confirme_le,
        vu: c.derniere_connexion,
        nom: nomDe(p.id ? p : null),
        app: !!p.is_apporteur,
        pre: !!p.is_prestataire,
        adm: !!p.is_admin,
        code: p.code_apporteur || ''
      };
    });

    var maintenant = Date.now();
    var jamais = lignes.filter(function (l) { return !l.vu; }).length;
    var recents = lignes.filter(function (l) {
      return l.vu && (maintenant - new Date(l.vu).getTime()) < 7 * 864e5;
    }).length;
    var attente = lignes.filter(function (l) { return !l.confirme; }).length;

    $('#scene').innerHTML =
      enteteHTML('Comptes', lignes.length + ' inscription' + (lignes.length > 1 ? 's' : '') + ' sur l\'application') +
      (cache.comptesErreur
        ? '<div class="erreur">Les dates de connexion sont indisponibles : ' + esc(cache.comptesErreur) +
          '<' + '/div>'
        : '') +
      '<div class="chiffres" style="margin-bottom:16px">' +
        chiffre(lignes.length, 'comptes crees') +
        chiffre(recents, 'revenus sous 7 jours', (recents ? 'accent' : '')) +
        chiffre(jamais, 'jamais connectes', (jamais ? 'alerte' : '')) +
        chiffre(attente, 'email non confirme', (attente ? 'alerte' : '')) +
      '<' + '/div>' +
      '<div class="tableau"><table><thead><tr>' +
        '<th>Inscrit le<' + '/th><th>Personne<' + '/th><th>Email<' + '/th><th>Confirme<' + '/th>' +
        '<th>Derniere connexion<' + '/th><th>Roles<' + '/th><th>Code<' + '/th>' +
      '<' + '/tr><' + '/thead><tbody>' +
      (lignes.length ? lignes.map(function (l) {
        var roles = [];
        if (l.adm) { roles.push('admin'); }
        if (l.app) { roles.push('apporteur'); }
        if (l.pre) { roles.push('prestataire'); }
        return '<tr>' +
          '<td>' + esc(heure(l.cree) || '—') + '<' + '/td>' +
          '<td><strong>' + esc(l.nom) + '<' + '/strong><' + '/td>' +
          '<td class="note">' + esc(l.email) + '<' + '/td>' +
          '<td>' + (l.confirme ? '<span class="etiq e-terminee">oui<' + '/span>'
                               : '<span class="etiq e-devis_envoye">en attente<' + '/span>') + '<' + '/td>' +
          '<td>' + (l.vu ? esc(heure(l.vu))
                         : '<span class="etiq e-perdu">jamais<' + '/span>') + '<' + '/td>' +
          '<td class="note">' + esc(roles.join(', ') || 'client') + '<' + '/td>' +
          '<td>' + (l.code ? '<code>' + esc(l.code) + '<' + '/code>' : '—') + '<' + '/td>' +
        '<' + '/tr>';
      }).join('') : '<tr><td colspan="7" class="vide">Aucun compte.<' + '/td><' + '/tr>') +
      '<' + '/tbody><' + '/table><' + '/div>' +
      '<p class="note" style="margin-top:10px">« Jamais connecte » signale un compte cree mais jamais rouvert : c\'est le signal le plus utile pendant la phase de test.<' + '/p>';

    brancherRafraichir();
  }

  /* =====================================================================
     Demarrage
     ===================================================================== */

  (async function () {
    if (!window.supabase || !CFG.SUPABASE_URL) {
      document.body.innerHTML = '<div style="padding:40px">Configuration Supabase introuvable.<' + '/div>';
      return;
    }
    sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
    var s = await sb.auth.getSession();
    if (s.data.session) { await apresConnexion(); }
    else { montrerPorte(); }
  })();

})();
</script>
</body>
</html>
